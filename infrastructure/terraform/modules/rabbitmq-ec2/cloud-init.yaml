#cloud-config
write_files:
  - path: /root/data/.erlang.cookie
    content: |
        ${secret_cookie}
  - path: /root/conf/enabled_plugins
    content: |
        [${arr_plugins}].
  - path: /root/conf/rabbitmq.config
    content: |
        [ { rabbit, [
          { loopback_users, [ ] } ] }
         ].
  - path: /root/find_hosts.sh
    content: |
        #!/usr/bin/env bash        

        export AWS_DEFAULT_REGION='${region}'

        DNSES=$(aws ec2 describe-instances --filters "Name=tag:aws:autoscaling:groupName,Values=${asg_name}*" "Name=instance-state-name,Values=running" | jq ".Reservations[].Instances[].PrivateDnsName" | xargs)

        HOSTNAMES=()
        for dns in $${DNSES[@]}; do
            hostname=$dns
            if [ "$hostname" != "$HOSTNAME" ]; then
              HOSTNAMES+=( $hostname )
            fi
        done

        echo $${HOSTNAMES[@]}
  - path: /root/bin/join_cluster.sh
    content: |
        #!/usr/bin/env sh

        HOSTNAMES=( $@ )

        for run in {1..3}; do
          sleep $[ ( $RANDOM % 10 )  + 1 ]
          rabbitmqctl stop_app

          NEW_HOSTNAMES=()
          for hostname in $${HOSTNAMES[@]}; do
            rabbitmqctl join_cluster rabbit@$hostname
            st=$?
            if [ $st -ne 0 ] && [ $st -ne 130 ]; then  # 130 is "already joined"
              NEW_HOSTNAMES+=( $hostname )
            fi
          done

          HOSTNAMES=( $${NEW_HOSTNAMES[@]} )
          rabbitmqctl start_app

          if [ $${#HOSTNAMES[@]} -eq 0 ]; then
            exit 0
          fi
        done
  - path: /root/configure.sh
    content: |
        #!/usr/bin/env bash
        docker exec rabbitmq rabbitmqctl add_user admin ${admin_password}
        docker exec rabbitmq rabbitmqctl set_user_tags admin administrator
        docker exec rabbitmq rabbitmqctl add_user rabbit ${rabbit_password}
        docker exec rabbitmq rabbitmqctl set_user_tags rabbit management
        docker exec rabbitmq rabbitmqctl add_vhost /
        docker exec rabbitmq rabbitmqctl set_policy -p / ha-three "^" '{"ha-mode":"exactly", "ha-params":${sync_node_count}, "ha-sync-mode":"automatic"}'
        docker exec rabbitmq rabbitmqctl set_permissions -p / admin ".*" ".*" ".*"
        docker exec rabbitmq rabbitmqctl set_permissions -p / rabbit ".*" ".*" ".*"
        docker exec rabbitmq rabbitmqctl delete_user guest   
        
runcmd:
  - yum update -y
  - yum install -y docker jq
  - service docker start
  - chkconfig docker on
  - usermod -a -G docker ec2-user
  - chmod 400 /root/data/.erlang.cookie
  - docker run -d --name rabbitmq --hostname $HOSTNAME -e RABBITMQ_USE_LONGNAME=true -p 4369:4369 -p 5672:5672 -p 15672:15672 -p 25672:25672 -v /root/data:/var/lib/rabbitmq -v /root/conf/:/etc/rabbitmq -v /root/bin:/tmp/bin ${rabbitmq_image}
  - sleep 1
  - aws s3 cp s3://${aws_s3_bucket}/plugins/ /root/plugins/ --recursive
  - docker cp /root/plugins/. rabbitmq:/opt/rabbitmq/plugins
  - docker exec rabbitmq chmod -R 755 /opt/rabbitmq/plugins/
  - docker exec rabbitmq chown -R rabbitmq:rabbitmq /opt/rabbitmq/plugins/
  - docker exec rabbitmq bash /tmp/bin/join_cluster.sh $(sudo bash /root/find_hosts.sh)
  - sleep 1
  - bash /root/configure.sh
