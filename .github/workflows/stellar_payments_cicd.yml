name: "Stellar Payments - CI/CD"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - stellar-payments/**
  push:
    paths:
      - stellar-payments/**
    branches:
      - 'main'

defaults:
  run:
    working-directory: stellar-payments/

jobs:

  code-quality:
    name: "Test & Lint"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["16.13"]
    outputs:
      environment: ${{ steps.set-outputs.outputs.environment }}
      resource_base_name: ${{ steps.set-outputs.outputs.resource_base_name }}
    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v3

      - name: Set environment
        id: set-outputs
        run: |
          if [[ "${{ github.ref }}" = "refs/heads/main" ]]; then
            echo "environment=Production" >> $GITHUB_OUTPUT
            echo "resource_base_name=${{ vars.RESOURCE_BASE_NAME }}-prod" >> $GITHUB_OUTPUT
          else
            echo "environment=NotFound" >> $GITHUB_OUTPUT
            echo "resource_base_name=NotFound" >> $GITHUB_OUTPUT
            echo "Branch not match"
          fi

      - name: Setup NodeJS locally
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "./stellar-payments/package-lock.json"

      - name: Install dependencies
        run: make clean-install-dev

      - name: Run tests 
        run: make coverage-test

      - uses: reviewdog/action-eslint@v1
        with:
          level: "info"
          workdir: "stellar-payments"
          fail_on_error: "true"

  build-image-deploy:
    name: Build & Push to ECR - ${{ needs.code-quality.outputs.environment }}
    runs-on: ubuntu-latest
    needs: ["code-quality"]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.code-quality.result == 'success'
    environment: ${{ needs.code-quality.outputs.environment }}
    env:
      ECR_REPOSITORY: ${{ needs.code-quality.outputs.resource_base_name }}-frontend-payment
      IMAGE_TAG: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PAYMENTS }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "IMAGE=$(echo $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG )" >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v3
        with:
          context: "./stellar-payments"
          platforms: linux/amd64
          target: prod
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            REACT_APP_API_URL= ${{ vars.STELLAR_PAYMENT_REACT_APP_API_URL}}
            REACT_APP_SENTRY_DSN=${{ secrets.STELLAR_PAYMENT_SENTRY_DSN}}