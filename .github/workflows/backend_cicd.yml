name: 'Backend - CI/CD'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - backend/**
  push:
    paths:
      - backend/**
    branches:
      - 'main'

defaults:
  run:
    working-directory: backend/

env:
  AWS_REGION: us-east-2

jobs:
  test-format:
    name: 'Test & Code Formatter'
    runs-on: ubuntu-latest
    env:
      ENV: test
      CORS_ALLOW_ALL_ORIGINS: True
      DJANGO_ALLOWED_HOSTS: '*,'
      LOG_ENABLE: false
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v3

      - name: Setup Python locally
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            ./backend/src/config/requirements.txt
            ./backend/src/config/requirements/test.txt

      - name: Install requirements
        run: make install-test-req

      - name: Run tests
        run: make test

      - name: Run Code formatter
        uses: reviewdog/action-black@v2
        with:
          level: 'error'
          reporter: 'github-check'
          filter_mode: 'nofilter'
          workdir: './backend'

  build-image-deploy-production:
    runs-on: ubuntu-latest
    needs: ['test', 'code-formatter']
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test-format.result == 'success'
    env:
      ECR_REPOSITORY: stellar-tf-prod-backend
      ECS_CLUSTER_NAME: stellar-tf-prod
      ECS_SERVICE_NAME: stellar-tf-prod-backend
      ECS_CONTAINER_NAME: stellar-tf-prod-backend
      ECS_TASK_NAME: stellar-tf-prod-backend
      IMAGE_TAG: ${{ github.sha }}
    permissions:
      contents: read

    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.PRODUCTION_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PRODUCTION_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "IMAGE=$(echo $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG )" >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v3
        with:
          context: "./backend"
          platforms: linux/amd64
          target: prod
          push: true
          tags: ${{ env.IMAGE }}

      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition --task-definition $ECS_TASK_NAME --query taskDefinition > task-definition.json
          cat task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./backend/task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true