name: 'Backend - CI/CD'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - backend/**
  push:
    paths:
      - backend/**
    branches:
      - main

defaults:
  run:
    working-directory: backend/

jobs:
  code-quality:
    name: 'Test, Lint & Code Format'
    runs-on: ubuntu-latest
    env:
      ENV: test
      CORS_ALLOW_ALL_ORIGINS: True
      DJANGO_ALLOWED_HOSTS: '*,'
      LOG_ENABLE: false
    strategy:
      matrix:
        python-version: ['3.10']
    outputs:
      environment: ${{ steps.set-outputs.outputs.environment }}
    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v3

      - name: Set environment
        id: set-outputs
        run: |
          if [[ "${{ github.ref }}" = "refs/heads/main" ]]; then
            echo "environment=Production" >> $GITHUB_OUTPUT
          else
            echo "environment=NotFound" >> $GITHUB_OUTPUT
            echo "Branch not match"
          fi

      - name: Setup Python locally
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            ./backend/src/config/requirements.txt
            ./backend/src/config/requirements/test.txt

      - name: Install requirements
        run: |
          make install-dev-req
          make install-test-req

      - name: Run tests
        run: make test

      - name: Run linter
        run: make lint

      - name: Run Code formatter
        uses: reviewdog/action-black@v2
        with:
          level: 'error'
          reporter: 'github-check'
          filter_mode: 'nofilter'
          workdir: './backend'

  build-image-deploy:
    name: Build & Push to ECR - ${{ needs.code-quality.outputs.environment }}
    runs-on: ubuntu-latest
    needs: ['code-quality']
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.code-quality.result == 'success'
    environment: ${{ needs.code-quality.outputs.environment }}
    env:
      ECR_REPOSITORY: ${{ vars.RESOURCE_BASE_NAME }}-tf-backend
      IMAGE_TAG: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_BACKEND }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "IMAGE=$(echo $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG )" >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v3
        with:
          context: "./backend"
          platforms: linux/amd64
          target: prod
          push: true
          tags: ${{ env.IMAGE }}