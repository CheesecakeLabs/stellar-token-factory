name: 'Backend - CI/CD'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - backend/**
  push:
    paths:
      - backend/**
    branches:
      - main

defaults:
  run:
    working-directory: backend/

jobs:
  code-quality:
    name: 'Test, Lint & Code Format'
    runs-on: ubuntu-latest
    env:
      ENV: test
      CORS_ALLOW_ALL_ORIGINS: True
      DJANGO_ALLOWED_HOSTS: '*,'
      LOG_ENABLE: false
    strategy:
      matrix:
        python-version: ['3.10']
    outputs:
      environment: ${{ steps.set-environment.outputs.environment }}
      resource_base_name: ${{ steps.set-outputs.outputs.resource_base_name }}
    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v3

      - name: Set environment
        id: set-environment
        run: |
          if [[ "${{ github.ref }}" = "refs/heads/main" ]]; then
            echo "environment=Production" >> $GITHUB_OUTPUT
            echo "resource_base_name=${{ vars.RESOURCE_BASE_NAME }}-prod" >> $GITHUB_OUTPUT
          else
            echo "environment=NotFound" >> $GITHUB_OUTPUT
            echo "resource_base_name=NotFound" >> $GITHUB_OUTPUT
            echo "Branch not match"
          fi

      - name: Setup Python locally
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            ./backend/src/config/requirements.txt
            ./backend/src/config/requirements/test.txt

      - name: Install requirements
        run: |
          make install-dev-req
          make install-test-req

      - name: Run tests
        run: make test

      - name: Run linter
        run: make lint

      - name: Run Code formatter
        uses: reviewdog/action-black@v2
        with:
          level: 'error'
          reporter: 'github-check'
          filter_mode: 'nofilter'
          workdir: './backend'

  build-image-deploy:
    name: Deploy - ${{ needs.code-quality.outputs.environment }}
    runs-on: ubuntu-latest
    needs: ['code-quality']
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.code-quality.result == 'success'
    environment: ${{ needs.code-quality.outputs.environment }}
    env:
      ECR_REPOSITORY: ${{ needs.code-quality.outputs.resource_base_name }}-backend
      ECS_CLUSTER_NAME: ${{ needs.code-quality.outputs.resource_base_name }}
      ECS_SERVICE_NAME: ${{ needs.code-quality.outputs.resource_base_name }}-backend
      ECS_CONTAINER_NAME: ${{ needs.code-quality.outputs.resource_base_name }}-backend
      ECS_TASK_NAME: ${{ needs.code-quality.outputs.resource_base_name }}-backend
      IMAGE_TAG: ${{ github.sha }}
    permissions:
      contents: read

    steps:
      - name: Checkout to current branch
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "IMAGE=$(echo $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG )" >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v3
        with:
          context: "./backend"
          platforms: linux/amd64
          target: prod
          push: true
          tags: ${{ env.IMAGE }}

      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition --task-definition $ECS_TASK_NAME --query taskDefinition > task-definition.json
          cat task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./backend/task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true